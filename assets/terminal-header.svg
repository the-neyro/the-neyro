<svg width="800" height="350" viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg" xml:space="preserve">
  <defs>
    <style>
      .titlebar { fill: #1f1f1f; }
      .body { fill: #0c0c0c; }
      .btn { fill: #cccccc; }
      .btn-close-bg:hover { fill: #e81123; }
      .prompt { font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 15px; }
      .ps { fill: #13a10e; }
      .path { fill: #3b78ff; }
      .cmd { fill: #e5e5e5; }
      .out { fill: #cccccc; }
      .accent { fill: #61d6d6; }
      .tab { fill: #2d2d2d; }
      .tabtext { fill: #cccccc; font-family: 'Segoe UI', sans-serif; font-size: 12px; }
    </style>
  </defs>

  <!-- window shadow -->
  <rect x="4" y="4" width="792" height="342" rx="8" fill="#000000" opacity="0.4"/>

  <!-- window body -->
  <rect x="0" y="0" width="796" height="338" rx="8" class="body"/>

  <!-- title bar -->
  <path d="M0 8 Q0 0 8 0 H788 Q796 0 796 8 V32 H0 Z" class="titlebar"/>

  <!-- tab -->
  <rect x="8" y="6" width="150" height="24" rx="4" class="tab"/>
  <text x="20" y="22" class="tabtext">Windows PowerShell</text>

  <!-- window control buttons -->
  <g stroke="#cccccc" stroke-width="1.4" fill="none">
    <line x1="700" y1="14" x2="712" y2="14"/>
    <rect x="734" y="8" width="12" height="12"/>
    <line x1="768" y1="8" x2="780" y2="20"/>
    <line x1="780" y1="8" x2="768" y2="20"/>
  </g>

  <!-- terminal content -->
  <g class="prompt">
    <text x="16" y="58"><tspan class="ps">PS </tspan><tspan class="path">C:\Users\Alex&gt;</tspan><tspan class="cmd"> whoami</tspan></text>
    <text x="16" y="82" class="accent">the-neyro</text>

    <text x="16" y="112"><tspan class="ps">PS </tspan><tspan class="path">C:\Users\Alex&gt;</tspan><tspan class="cmd"> cat status.txt</tspan></text>
    <text x="16" y="136" class="out">Fachinformatiker Anwendungsentwicklung (Umschulung)</text>
    <text x="16" y="156"><tspan class="accent">currently learning</tspan><tspan class="out"> : React</tspan></text>
    <text x="16" y="176"><tspan class="accent">working with      </tspan><tspan class="out"> : Java · TypeScript · PHP · MySQL · C#</tspan></text>

    <text x="16" y="206"><tspan class="ps">PS </tspan><tspan class="path">C:\Users\Alex&gt;</tspan><tspan class="cmd"> ls .\projekte\</tspan></text>
    <text x="16" y="230" class="out">NullPointerPanic    [React]</text>
    <text x="16" y="250" class="out">Stranded &amp; Sober    [Java]</text>
    <text x="16" y="270" class="out">Crypto Tracker      [TypeScript]</text>
    <text x="16" y="290" class="out">Simple              [PHP · MySQL]</text>

    <text x="16" y="320"><tspan class="ps">PS </tspan><tspan class="path">C:\Users\Alex&gt;</tspan><tspan class="cmd"> _</tspan></text>
  </g>
</svg>
